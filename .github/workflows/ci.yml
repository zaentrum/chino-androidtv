name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Neutrality gate: this is a PUBLIC, vendor-neutral client. Fail the build if
  # any internal hostname, competitor product name, or acquisition vocabulary
  # leaks into the tree. Runs first; build jobs depend on it.
  # ---------------------------------------------------------------------------
  neutrality:
    name: Neutrality check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      # No internal hostname and no competitor product name anywhere in the
      # tree (comments included), no acquisition vocabulary in user-facing
      # surfaces (Android resources and docs). The script holds the patterns,
      # assembled from fragments so the tree (this workflow and the script
      # included) stays literally free of every banned string. A name counts
      # with "_" beside it (FOO_API_URL), which \b and rg -w let through; the
      # script first checks its patterns against lines they must and must not
      # flag, and fails when one has gone blind.
      - name: Neutrality guard
        run: bash scripts/check-neutrality.sh

  # ---------------------------------------------------------------------------
  # Debug builds: always build both flavors so every push is exercised.
  # ---------------------------------------------------------------------------
  build:
    name: Build debug APKs
    needs: neutrality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default also installs the legacy 'tools' package, which
          # the SDK repository no longer offers; the build needs platform-tools
          # only (Gradle fetches the platform and build tools it declares).
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Secret presence as a job output. The `secrets` context is NOT allowed in a
  # job-level `if:`, so read it in a step here and gate `release` on the output.
  # ---------------------------------------------------------------------------
  check-secrets:
    name: Check signing secrets
    runs-on: ubuntu-latest
    outputs:
      has_keystore: ${{ steps.check.outputs.has_keystore }}
    steps:
      - id: check
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Signed release AAB: only runs when an upload keystore secret is configured.
  # When the secret is absent the whole job is skipped — it never fails the
  # pipeline for forks / contributors who don't have signing material.
  # ---------------------------------------------------------------------------
  release:
    name: Build signed release AAB
    needs: [neutrality, check-secrets]
    if: ${{ needs.check-secrets.outputs.has_keystore == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default also installs the legacy 'tools' package, which
          # the SDK repository no longer offers; the build needs platform-tools
          # only (Gradle fetches the platform and build tools it declares).
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          echo "$SIGNING_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
          echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"

      - name: Build signed release AAB
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :app:bundleRelease --stacktrace

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
